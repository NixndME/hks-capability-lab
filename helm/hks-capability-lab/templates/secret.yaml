apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hks.fullname" . }}-demo-secret
  namespace: {{ include "hks.namespace" . }}
  labels:
    {{- include "hks.labels" . | nindent 4 }}
  annotations:
    hks-capability-lab/note: "Placeholder secret for demonstrating Secret consumption via env var. Not a real credential."
type: Opaque
stringData:
  demo-api-key: {{ .Values.secret.demoApiKey | quote }}
