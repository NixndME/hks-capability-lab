- id: DEP-001
  name: Rolling update v1 -> v2
  category: Deployments
  description: Standard rolling update honoring maxUnavailable/maxSurge, driven purely by an env var change (no image rebuild).
  prerequisites: [APP-001]
  deployment_modes: [yaml]
  artifacts: [hks-capability-lab.yaml]
  commands:
    - "kubectl -n hks-capability-lab set env deployment/hks-lab-app APP_VERSION=v2"
    - "kubectl -n hks-capability-lab rollout status deployment/hks-lab-app"
  success_conditions:
    - rollout_completes
    - new_pods_report_v2
    - maxUnavailable_maxSurge_honored
  result: PASS
  result_notes: "Rolled out respecting maxUnavailable:1/maxSurge:1; /api/info on new pods reported v2."
  evidence: []
  docs: [docs/validation/TEST_RESULTS.md]
  last_validated: "2026-08-12"

