- id: DEP-003
  name: Rollback v3 -> v2
  category: Deployments
  description: kubectl rollout undo reuses the prior ReplicaSet rather than recreating it.
  prerequisites: [DEP-002]
  deployment_modes: [yaml]
  artifacts: [hks-capability-lab.yaml]
  commands:
    - "kubectl -n hks-capability-lab rollout undo deployment/hks-lab-app"
  success_conditions:
    - existing_replicaset_reused
    - pods_report_previous_version
  result: PASS
  result_notes: "Reused the existing v2 ReplicaSet (hks-lab-app-7cd694d464) rather than recreating it; /api/info confirmed v2 after pods settled."
  evidence: []
  docs: [docs/validation/TEST_RESULTS.md]
  last_validated: "2026-08-12"

- id: DEP-004
  name: Blue/Green deployment
  category: Deployments
  description: Two independent Deployments (blue/green), Service selector patched between tracks for instant cutover and rollback.
  prerequisites: [APP-001]
  deployment_modes: [yaml]
  artifacts: [manifests/blue-green.yaml]
  commands:
    - "envsubst < manifests/blue-green.yaml | kubectl apply -f -"
    - "kubectl -n hks-capability-lab patch svc hks-lab-bluegreen -p '{\"spec\":{\"selector\":{\"hks-capability-lab/track\":\"green\"}}}'"
  success_conditions:
    - both_tracks_coexist
    - traffic_switches_on_selector_patch
    - rollback_switches_traffic_back
  result: PASS
  result_notes: "5/5 requests to blue returned blue v1; after the flip, 5/5 returned green v2; after rolling back, 5/5 returned blue v1 again. Both tracks ran simultaneously throughout (2 blue + 2 green pods)."
  evidence: [evidence/bluegreen/bluegreen.txt]
  docs: [docs/validation/TEST_RESULTS.md]
  last_validated: "2026-08-12"

- id: DEP-005
  name: Canary deployment (90/10)
  category: Deployments
  description: >
    Native ingress-nginx canary-weight annotation splits traffic between
    stable and canary Deployments. No service mesh required or installed.
  prerequisites: [APP-001, NET-006]
  deployment_modes: [yaml]
  artifacts: [manifests/canary.yaml]
  commands:
    - "envsubst < manifests/canary.yaml | kubectl apply -f -"
    - "for i in $(seq 1 50); do curl -s -H \"Host: ${TEST_HOST}\" http://<ctrl-ip>:<nodeport>/api/info; done"
  success_conditions:
    - stable_and_canary_coexist
    - observed_split_approximates_configured_weight
  result: PASS
  result_notes: >
    Requires the discovered IngressClass to be "nginx" (this test is
    SKIPPED, not FAILED, on clusters where it is not -- the annotation is
    ingress-nginx-specific, not a general Kubernetes capability). On this
    cluster: 50 requests via Ingress -> 45 stable (v2) / 5 canary (v3), a
    90/10 split matching the configured 10% weight.
  evidence: [evidence/canary/results.txt, evidence/canary/summary.txt]
  docs: [docs/validation/TEST_RESULTS.md]
  last_validated: "2026-08-12"
