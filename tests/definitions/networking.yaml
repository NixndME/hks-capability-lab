- id: NET-006
  name: Ingress
  category: Networking
  description: Validate Ingress routing through the cluster's existing ingress-nginx install.
  prerequisites: [APP-001]
  deployment_modes: [yaml]
  artifacts: [hks-capability-lab.yaml]
  commands:
    - "curl -H \"Host: ${TEST_HOST}\" http://<node-ip>:<http-nodeport>/"
  success_conditions:
    - http_200_via_ingress_host_header
  result: PASS
  result_notes: >
    Two of four node IPs initially timed out -- root cause: ingress-nginx's
    Service has externalTrafficPolicy: Local (the ingress-nginx default,
    preserves client source IP), so its NodePort only answers on the node
    actually running the controller pod. Expected behavior, not a bug, once
    identified. Retested against the correct node: HTTP 200. HTTPS via the
    controller's default self-signed cert also validated.
  evidence: [evidence/access-modes/ingress.txt]
  docs: [docs/validation/TEST_RESULTS.md, docs/validation/NETWORKING_DECISION.md]
  last_validated: "2026-08-12"

- id: NET-007
  name: TLS via Ingress
  category: Networking
  description: HTTPS reachability through the Ingress controller's default cert.
  prerequisites: [NET-006]
  deployment_modes: [yaml]
  artifacts: [hks-capability-lab.yaml]
  commands:
    - "curl -sk -H \"Host: ${TEST_HOST}\" https://<node-ip>:<https-nodeport>/"
  success_conditions:
    - https_200_response
  result: PASS
  result_notes: "HTTPS NodePort 30337, self-signed default cert, HTTP 200."
  evidence: [evidence/access-modes/ingress.txt]
  docs: [docs/validation/TEST_RESULTS.md]
  last_validated: "2026-08-12"
