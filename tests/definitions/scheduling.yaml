- id: SCHED-001
  name: Soft anti-affinity / topology spread
  category: Scheduling
  description: Preferred (soft) pod anti-affinity and topologySpreadConstraints influence pod placement.
  prerequisites: [APP-001]
  deployment_modes: [yaml]
  artifacts: [hks-capability-lab.yaml]
  commands:
    - "kubectl -n hks-capability-lab get pods -o custom-columns=NAME:.metadata.name,NODE:.spec.nodeName"
  success_conditions:
    - pods_spread_across_nodes_where_capacity_allows
  result: PASS
  result_notes: >
    PASS WITH CAVEAT: soft (preferred) anti-affinity/topology-spread
    constraints influenced but did not guarantee perfectly even distribution
    under node contention. This is expected Kubernetes behavior for
    "preferred" (as opposed to "required") constraints, not a defect.
  evidence: [evidence/scheduling/scheduling.txt]
  docs: [SCHEDULING_VALIDATION.md]
  last_validated: "2026-08-12"

