# HKS Capability Lab -- Rolling Update to v2
#
# Same Deployment (hks-lab-app) as 02-application.yaml, with APP_VERSION
# bumped to "v2". Applying this over the running v1 Deployment triggers a
# standard Kubernetes RollingUpdate: old pods are replaced with new ones
# gradually, maintaining availability throughout (equivalent to
# `kubectl set env deployment/hks-lab-app APP_VERSION=v2`, expressed
# declaratively instead).
#
# Depends on: 02-application.yaml (must already be applied and rolled out).
#
# Apply with:
#   kubectl apply -f 13-rolling-update-v2.yaml
#
# Verify:
#   kubectl -n hks-capability-lab rollout status deployment/hks-lab-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hks-lab-app
  namespace: hks-capability-lab
  labels:
    app.kubernetes.io/name: hks-lab-app
    app.kubernetes.io/part-of: hks-capability-lab
    hks-capability-lab/track: stable
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hks-lab-app
      hks-capability-lab/track: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hks-lab-app
        app.kubernetes.io/part-of: hks-capability-lab
        hks-capability-lab/track: stable
    spec:
      serviceAccountName: hks-lab-app
      automountServiceAccountToken: false
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "v2"
            - name: APP_COLOR
              value: "blue"
            - name: APP_PORT
              value: "8080"
            - name: CONTAINER_NAME
              value: "app"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hks-lab-demo-secret
                  key: demo-api-key
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: hks-lab-app-code
            defaultMode: 0555
